exclude: ^(frontend/(node_modules|dist)/|backend/target/|.*\.tsbuildinfo$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(frontend/(node_modules|dist)/|backend/target/)
      - id: end-of-file-fixer
        exclude: ^(frontend/(node_modules|dist)/|backend/target/)
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-json
        exclude: ^(frontend/(node_modules|dist)/|\.devcontainer/.*\.json$)
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: bash -c 'cd backend && cargo fmt --all -- --check'
        language: system
        pass_filenames: false
        files: ^backend/.*\.rs$
